<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual de Processos — Fiscal</title>
<style>

  :root{
    --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F5F8FC;
    --ink:#1E2621; --muted:#6C736D; --faint:#9AA09A;
    --accent:#184CA0; --accent-soft:#E8EEF8; --accent-ink:#123A7D;
    --border:#E7E5DE; --border-strong:#D6D4CC;
    --ok:#1D9E75; --draft:#BA7517; --empty:#9AA09A;
    --ok-soft:#E1F5EE; --ok-ink:#0F6E56;
    --draft-soft:#FAEEDA; --draft-ink:#854F0B;
    --empty-soft:#E7EDF5; --empty-ink:#5F5E5A;
    --radius:10px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  .app{max-width:1500px;margin:0 auto;padding:18px 16px;}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:4px 4px 12px;border-bottom:1px solid var(--border);margin-bottom:14px;}
  .brand{font-size:23px;font-weight:600;letter-spacing:-0.01em;}
  .brand span{color:var(--accent);}
  .subtitle{font-size:13px;color:var(--muted);}
  .updated{margin-left:auto;font-size:12px;color:var(--faint);}
  .layout{display:grid;grid-template-columns:255px 1fr;gap:22px;height:calc(100vh - 188px);}
  .rail{overflow-y:auto;height:100%;align-self:stretch;padding-right:10px;}
  .search{width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);font-size:13px;background:var(--surface);color:var(--ink);margin-bottom:6px;}
  .search::placeholder{color:var(--faint);}
  .sectoggle{cursor:pointer;user-select:none;}
  .cat-label{cursor:pointer;user-select:none;font-size:12px;font-weight:600;color:var(--muted);margin:4px 0 2px;padding:5px 10px 5px 16px;border-radius:6px;}
  .cat-label:hover{background:var(--surface-1);}
  .item-sub{padding-left:26px;}
  .sec-label{font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--accent-ink);text-transform:uppercase;margin:18px 0 6px;padding:4px 8px;background:var(--accent-soft);border-radius:6px;display:inline-block;}
  .item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--muted);cursor:pointer;transition:background .12s,color .12s;}
  .item:hover{background:var(--surface);color:var(--ink);}
  .item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:500;}
  .item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .legend{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);}
  .legend div{display:flex;align-items:center;gap:8px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 30px;overflow-y:auto;height:100%;}
  .crumb{font-size:12px;color:var(--faint);margin-bottom:6px;}
  .titlerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px;}
  h1{font-size:25px;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .pill{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;}
  .pill.pronto{background:var(--ok-soft);color:var(--ok-ink);}
  .pill.rascunho{background:var(--draft-soft);color:var(--draft-ink);}
  .pill.vazio{background:var(--empty-soft);color:var(--empty-ink);}
  .lead{font-size:15px;color:var(--muted);margin:8px 0 18px;max-width:74ch;line-height:1.65;}
  .cta{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:var(--radius);font-size:14px;font-weight:500;transition:background .15s;}
  .cta:hover{background:var(--accent-ink);}
  .cta svg{width:15px;height:15px;}
  .cta.secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--border-strong);}
  .cta.secondary:hover{background:var(--bg);}
  .steps{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
  .step{border:1px solid var(--border);border-radius:var(--radius);padding:15px 18px;background:var(--surface-2);}
  .step .h{font-weight:500;font-size:14.5px;margin-bottom:2px;display:flex;gap:9px;}
  .step .num{color:var(--accent);font-variant-numeric:tabular-nums;}
  .step .d{font-size:14.5px;color:var(--muted);line-height:1.62;}
  .step .lnk{margin-top:7px;display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--accent);text-decoration:none;font-weight:500;}
  .step .lnk:hover{text-decoration:underline;}
  .step .lnk.todo{color:var(--draft-ink);cursor:default;}
  .empty-box{border:1px dashed var(--border-strong);border-radius:var(--radius);padding:36px;text-align:center;color:var(--faint);font-size:13.5px;}
  .present-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .stage{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;}
  .caption{margin-top:16px;padding:14px 18px;background:var(--accent-soft);border-radius:var(--radius);min-height:64px;}
  .caption .ct{font-weight:600;color:var(--accent-ink);margin-bottom:2px;}
  .caption .cd{font-size:13.5px;color:var(--accent-ink);opacity:.85;}
  .pres-nav{display:flex;align-items:center;gap:10px;margin-top:16px;}
  .pres-nav.sticky{position:sticky;top:6px;z-index:6;background:var(--surface);padding:10px 0;margin:0 0 4px;border-bottom:1px solid var(--border);}
  .counter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .pres-nav .spacer{flex:1;}
  .fnode{transition:opacity .25s;}
  .flow{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .flow.stepping .fnode{opacity:.22;}
  .flow.stepping .fnode.hl{opacity:1;}
  .fnode.hl rect,.fnode.hl polygon,.fnode.hl ellipse{stroke-width:3;}
  .flow.stepping .edge{opacity:.3;}
  svg a{cursor:pointer;}
  svg a rect{transition:filter .12s;}
  svg a:hover rect{filter:brightness(0.97);}
  svg text{font-family:var(--sans);}
  .th{fill:var(--ink);font-weight:500;}
  .ts{fill:var(--muted);font-size:12px;}
  .zlabel{fill:var(--faint);font-size:12px;font-weight:600;letter-spacing:0.04em;}
  .arr{stroke:var(--border-strong);stroke-width:1.5;fill:none;}
  @media (max-width:760px){.layout{grid-template-columns:1fr;height:auto;}.rail{height:auto;overflow:visible;}.panel{height:auto;overflow:visible;}}

  #cover{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 120% at 50% 0%, #FFFFFF 0%, var(--bg) 55%);display:flex;align-items:center;justify-content:center;padding:24px;}
  .cover-inner{max-width:640px;text-align:center;}
  .cover-eyebrow{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;}
  .cover-title{font-size:46px;line-height:1.1;font-weight:600;letter-spacing:-0.02em;margin:0 0 18px;}
  .cover-title span{color:var(--accent);}
  .cover-sub{font-size:17px;line-height:1.6;color:var(--muted);margin:0 auto 34px;max-width:52ch;}
  .cover-btn{background:var(--accent);color:#fff;border:none;font-size:16px;font-weight:500;padding:14px 28px;border-radius:12px;cursor:pointer;transition:background .15s,transform .08s;}
  .cover-btn:hover{background:var(--accent-ink);}
  .cover-btn:active{transform:translateY(1px);}
  .cover-foot{margin-top:26px;font-size:13px;color:var(--faint);}

  :root{--surface-1:#E7EDF5;--danger:#E24B4A;--danger-soft:#FCEBEB;--danger-ink:#791F1F;--text-accent:#184CA0;}
  .tabbar{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;padding:0 2px;flex-wrap:wrap;}
  .tabbtn{background:none;border:none;padding:11px 20px;font-size:14.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;border-radius:8px 8px 0 0;}
  .tabbtn:hover{color:var(--ink);background:var(--surface);}
  .tabbtn.active{color:var(--accent-ink);border-bottom-color:var(--accent);}
  .panel-full{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 30px;}

  .brand-logo{width:34px;height:34px;border-radius:7px;vertical-align:middle;margin-right:10px;}
  header{align-items:center;}
  .cover-logo{width:76px;height:76px;border-radius:14px;margin:0 auto 20px;display:block;}
  .cal-alert{border-radius:10px;padding:12px 16px;margin-bottom:10px;font-weight:500;}
  .cal-alert.danger{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger-ink);}
  .cal-alert.warn{background:var(--draft-soft);border:1px solid var(--draft);color:var(--draft-ink);}
  .calmonth{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .calmonth-h{padding:12px 16px;font-weight:500;cursor:pointer;background:var(--surface-2);}
  .calmonth-h:hover{background:var(--bg);}
  .caldot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);}

  .calpicker{border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:10px;background:var(--surface-2);}
  .calpicker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:15px;font-weight:600;}
  .calpicker-head .yrnav button{background:none;border:1px solid var(--border-strong);border-radius:7px;min-width:30px;height:28px;cursor:pointer;margin-left:6px;color:var(--muted);font-size:15px;}
  .calpicker-head .yrnav button:hover{background:var(--bg);color:var(--ink);}
  .calmon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .calmon{text-align:center;padding:9px 4px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;position:relative;}
  .calmon:hover{background:var(--bg);}
  .calmon.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
  .panel-full .crumb{text-align:center;}
  .panel-full .titlerow{justify-content:center;}
</style>
</head>
